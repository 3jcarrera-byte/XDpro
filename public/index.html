<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominio de Arena y Gloria</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL (El marco dorado) -->
  <main class="login-card">
    
    <!-- Título principal estilizado -->
    <header class="title-container">
      <h1 class="game-title">ARENA Y GLORIA</h1>
    </header>

    <!-- FORMULARIO INTERNO (El cuadro color crema/blanco translúcido) -->
    <section class="form-wrapper">
      <form id="loginForm">
        <h2>Iniciar sesión</h2>
        
        <div class="input-field">
          <input type="text" id="username" placeholder="Usuario" required>
        </div>
        
        <div class="input-field">
          <input type="password" id="password" placeholder="Contraseña" required>
        </div>
        
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      
      <div class="form-footer">
        <a href="#" class="forgot-link">Olvidé mi contraseña</a>
      </div>
    </section>

    <!-- BOTÓN REGISTRARSE (Dentro del marco dorado, abajo del cuadro del formulario) -->
    <footer class="card-action">
      <button id="btnRegister" class="btn-secondary">Registrarse</button>
    </footer>

  </main>

  <!-- BOTÓN FLOTANTE MENÚ (Fuera del flujo principal, abajo a la derecha) -->
  <button id="btnFloatingMenu" class="floating-menu">Menú</button>

  <script src="js/main.js"></script>
</body>
</html>
